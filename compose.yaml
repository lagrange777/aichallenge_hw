services:
  codex-chat:
    build:
      context: .
    image: codex-chat-cli:local
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the shell or .env file}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.3-codex}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-2m}
    stdin_open: true
    tty: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
