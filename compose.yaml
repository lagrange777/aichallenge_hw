services:
  codex-chat:
    build:
      context: .
    image: codex-chat-web:local
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the shell or .env file}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.3-codex}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-2m}
      WEB_ADDR: 0.0.0.0:8080
      HISTORY_PATH: /data/history.json
      MEMORY_PATH: /data/memory
      PROFILE_PATH: /data/profiles
      MCP_PATH: /data/mcp.json
      PROJECT_ROOT: /project
      WORKSPACE_ROOT: /workspace
      PROJECT_INDEX_PATH: /data/project-index.json
      PROJECT_MCP_URL: http://project-mcp:8094/mcp
      SCHEDULER_PATH: /data/scheduler.db
      DOCUMENT_INDEX_PATH: /documents/artifacts/index.sqlite
      MCP_HTTP_ENDPOINTS: http://mock-issue-mcp:8090/mcp,http://demo-order-mcp:8090/mcp,http://demo-validation-mcp:8090/mcp,http://demo-broker-mcp:8090/mcp,http://project-mcp:8094/mcp
      BROKER_DEMO_ORDER_MCP: http://demo-order-mcp:8090/mcp
      BROKER_DEMO_VALIDATION_MCP: http://demo-validation-mcp:8090/mcp
      BROKER_DEMO_BROKER_MCP: http://demo-broker-mcp:8090/mcp
      CONTEXT_KEEP_LAST: ${CONTEXT_KEEP_LAST:-10}
      CONTEXT_STRATEGY: ${CONTEXT_STRATEGY:-sliding_window}
    networks: [default, mcp]
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    read_only: true
    volumes:
      - chat-history:/data
      - ./README.md:/project/README.md:ro
      - ./docs:/project/docs:ro
      # Public, isolated snapshot. Prepare once with scripts/prepare-workspace.py.
      - ./.workspaces/project:/workspace
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      project-mcp:
        condition: service_healthy
      demo-order-mcp:
        condition: service_started
      demo-validation-mcp:
        condition: service_started
      demo-broker-mcp:
        condition: service_started

  project-mcp:
    build:
      context: .
      target: project-mcp
    image: codex-project-mcp:local
    environment:
      PROJECT_ROOT: /project
      LISTEN_ADDR: 0.0.0.0:8094
    # Only Git metadata is needed: no .env, user data or repository content.
    volumes:
      - ./.git:/project/.git:ro
    read_only: true
    networks: [default]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8094/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  demo-order-mcp:
    build:
      context: .
    image: codex-chat-web:local
    entrypoint: ["/broker-demo"]
    environment:
      BROKER_DEMO_ROLE: orders
      BROKER_DEMO_DB: /data/orders.db
      BROKER_DEMO_SECRET: ${BROKER_DEMO_SECRET:-local-demo-secret-change-me}
      LISTEN_ADDR: 0.0.0.0:8090
    ports:
      - "127.0.0.1:8091:8090"
    read_only: true
    volumes:
      - broker-orders:/data
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  demo-validation-mcp:
    build:
      context: .
    image: codex-chat-web:local
    entrypoint: ["/broker-demo"]
    environment:
      BROKER_DEMO_ROLE: validation
      BROKER_DEMO_DB: /data/validation.db
      BROKER_DEMO_SECRET: ${BROKER_DEMO_SECRET:-local-demo-secret-change-me}
      LISTEN_ADDR: 0.0.0.0:8090
    ports:
      - "127.0.0.1:8092:8090"
    read_only: true
    volumes:
      - broker-validation:/data
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  demo-broker-mcp:
    build:
      context: .
    image: codex-chat-web:local
    entrypoint: ["/broker-demo"]
    environment:
      BROKER_DEMO_ROLE: broker
      BROKER_DEMO_DB: /data/broker.db
      BROKER_DEMO_SECRET: ${BROKER_DEMO_SECRET:-local-demo-secret-change-me}
      LISTEN_ADDR: 0.0.0.0:8090
    ports:
      - "127.0.0.1:8093:8090"
    read_only: true
    volumes:
      - broker-execution:/data
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  chat-history:
  broker-orders:
  broker-validation:
  broker-execution:

networks:
  mcp:
    name: codex-mcp
    external: true
